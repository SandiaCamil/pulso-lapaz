<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · Iniciar sesión</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
    <main class="login">
        <form id="form-login" class="tarjeta">
        <h1>Panel de administración</h1>
        <p class="meta">Pulso de La Paz</p>
        <label>Usuario<input id="usuario" autocomplete="username" required></label>
        <label>Contraseña<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="btn" type="submit" id="btn-login">Ingresar</button>
        <a href="../index.html" class="enlace-volver">← Volver al mapa</a>
        </form>
    </main>
    <div id="toast"></div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script>
        if (Sesion.activa()) location.replace('alertas.html');

        document.getElementById('form-login').addEventListener('submit', async e => {
        e.preventDefault();
        const boton = document.getElementById('btn-login');
        boton.disabled = true;
        try {
            const sesion = await Api.login(
            document.getElementById('usuario').value,
            document.getElementById('password').value
            );
            Sesion.guardar(sesion);
            location.href = 'alertas.html';
        } catch (err) {
            toast(err.message, true);
            boton.disabled = false;
        }
        });
    </script>
</body>
</html>
