<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin · Alertas</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛠️%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
    <header class="barra">
        <h1>Panel admin</h1>
        <nav class="nav">
            <a href="alertas.html" class="activo">📋 Alertas</a>
            <a href="../index.html">🗺️ Mapa</a>
            <button id="btn-salir" class="enlace">Salir</button>
        </nav>
    </header>

    <main class="contenedor">
        <section class="resumen" id="resumen"></section>

        <div class="herramientas">
            <input id="q" type="search" placeholder="Buscar por descripción, zona o tipo...">
            <select id="f-tipo"><option value="">Todos los tipos</option></select>
            <select id="f-estado">
                <option value="">Todos los estados</option>
                <option value="activo">Activas</option>
                <option value="resuelto">Resueltas</option>
                <option value="descartado">Descartadas</option>
            </select>
            <button id="btn-recargar" class="btn sec">↻ Actualizar</button>
        </div>

        <div class="tabla-wrap">
            <table>
                <thead>
                    <tr>
                        <th>Tipo</th><th>Descripción</th><th>Gravedad</th><th>Zona</th>
                        <th>Estado</th><th>Votos</th><th>Creada</th><th></th>
                    </tr>
                </thead>
                <tbody id="filas"></tbody>
            </table>
        </div>
    </main>

    <div id="modal" class="modal"><div class="modal-caja" id="modal-caja"></div></div>
    <div id="toast"></div>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/editorCampos.js"></script>
    <script src="js/tablaAlertas.js"></script>
</body>
</html>
